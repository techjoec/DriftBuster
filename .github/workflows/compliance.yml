# Disabled — all checks are local-only (see CLAUDE.md / CONTRIBUTING.md).
# Kept up-to-date so it can be re-enabled if the policy changes.
name: Compliance & Tests

on:
  workflow_dispatch:

jobs:
  build-test-licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install compliance tools
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pip-licenses || true

      - name: Secret scan
        run: gitleaks dir . -v || true

      - name: Restore & build
        run: |
          dotnet restore gui/DriftBuster.Gui.Tests/DriftBuster.Gui.Tests.csproj
          dotnet build gui/DriftBuster.Gui.Tests/DriftBuster.Gui.Tests.csproj --configuration Release --nologo

      - name: Tests
        run: dotnet test gui/DriftBuster.Gui.Tests/DriftBuster.Gui.Tests.csproj --configuration Release --no-build --nologo
