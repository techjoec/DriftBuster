# Disabled — all checks are local-only (see CLAUDE.md / CONTRIBUTING.md).
# Kept up-to-date so it can be re-enabled if the policy changes.
name: Compliance & Tests

on:
  workflow_dispatch:

jobs:
  build-test-licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Secret scan
        run: gitleaks dir . -v || true

      - name: Restore & build
        run: |
          dotnet restore DriftBuster.sln
          dotnet build DriftBuster.sln --configuration Release --nologo

      - name: Tests
        run: dotnet test DriftBuster.sln --configuration Release --no-build --nologo
