[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "driftbuster"
version = "0.1.0"
description = "Core detection engine for DriftBuster"
readme = "README.md"
requires-python = ">=3.12"
authors = []
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=46.0.0",
]

[project.scripts]
driftbuster = "driftbuster.cli:console_main"
driftbuster-export-sql = "driftbuster.cli:export_sql_console_main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"driftbuster" = ["secret_rules.json"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.ruff.lint.per-file-ignores]
"src/driftbuster/offline_runner.py" = ["E402"]
