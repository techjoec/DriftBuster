# Gitleaks configuration — suppress known false positives and test fixtures.
# See https://github.com/gitleaks/gitleaks#configuration

[extend]
# Inherit all default detection rules.
useDefault = true

[allowlist]
  description = "Global allowlist for known false positives"

  paths = [
    # Build artifacts (not tracked in git but scanned by `gitleaks dir`)
    '''obj/''',

    # Gitignored local tool configuration in .claude/ subdirectories (never committed)
    '''(^|/)\.claude/[^/]+/''',

    # Intentional dummy secrets used by the hunt/secret-scanning test suite
    '''fixtures/secret_samples/''',

    # Dummy secrets and argument names in the regex case data
    '''gui/DriftBuster\.Backend\.Tests/Infrastructure/Data/regex_cases\.json''',
  ]

  regexTarget = "match"
  regexes = [
    # AXAML resource keys like Key="Toast.Width.1280" are not secrets
    '''Key="Toast\.''',
  ]
